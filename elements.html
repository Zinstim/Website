<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elements — ZinStim</title>
<meta name="description" content="Wear and Fuel. Two ways into the ZinStim range.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Anek+Bangla:wdth,wght@75..125,100..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/brand.css">
<style>
/* ── page-load ────────────────────────────────────────────── */
.settle{opacity:0;transform:translateY(.5em)}
.is-ready .settle{
  opacity:1;transform:none;
  transition:opacity .8s ease,transform 1s var(--ease-out);
}

/* ── door bands ─────────────────────────────────────────── */
.door-band{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
  padding:var(--space-2xl) 0;
}
.door-name{
  transition:opacity .45s ease, transform .45s ease;
  opacity:0.28;
  line-height:1;
}
.door-band:hover .door-name,
.door-band:focus-visible .door-name {
  opacity:1;
}
.door-sub{
  margin-top:var(--space-md);
  color:var(--graphite);
  opacity:0;
  transform:translateY(1rem);
  transition:opacity .45s ease, transform .45s ease;
  font-size:var(--step-1);
}
.band--dark .door-sub {
  color:var(--muted);
}
.door-band:hover .door-sub,
.door-band:focus-visible .door-sub {
  opacity:1;
  transform:translateY(0);
}

/* ── plates ─────────────────────────────────────────────── */
.plate{
  position:absolute;z-index:1;
  border-radius:2px;
  background:var(--zinc-silver);
  opacity:.5;
  transition:transform .9s var(--ease-out),opacity .6s ease,background .6s ease;
  will-change:transform;
}
.band--dark .plate {
  background:var(--graphite);
  opacity:.32;
}

.door-band .plate--a{width:15vw;height:20vw;max-width:15rem;max-height:20rem;top:10%;left:5%;}
.door-band .plate--b{width:11vw;height:11vw;max-width:11rem;max-height:11rem;top:55%;right:8%;}
.door-band .plate--c{width:9vw;height:12vw;max-width:9rem;max-height:12rem;bottom:8%;left:22%;}

/* Hover reveals per door */
/* Wear */
.door-band[data-door="0"]:hover .plate--a{transform:translate(1.5rem,2rem) rotate(-3deg)}
.door-band[data-door="0"]:hover .plate--b{transform:translate(-2rem,-3rem)}
.door-band[data-door="0"]:hover .plate--c{transform:translate(3rem,-1rem) rotate(2deg)}
/* Fuel */
.door-band[data-door="1"]:hover .plate--a{transform:translate(4rem,-3rem) rotate(4deg)}
.door-band[data-door="1"]:hover .plate--b{transform:translate(-4rem,3rem) rotate(-2deg)}
.door-band[data-door="1"]:hover .plate--c{transform:translate(-2rem,-4rem)}

.door-band[data-door="2"]:hover .plate--a{transform:translate(-1rem,5rem) rotate(-6deg)}
.door-band[data-door="2"]:hover .plate--b{transform:translate(2rem,-6rem) rotate(3deg)}
.door-band[data-door="2"]:hover .plate--c{transform:translate(6rem,2rem)}

@media (max-width:860px){
  .plate{display:none}
  .door-name{opacity:1}
  .door-sub{opacity:1; transform:none}
}

.foot{padding:var(--space-lg) 0;display:flex;justify-content:space-between;
  flex-wrap:wrap;gap:var(--space-md)}

</style>
</head>
<body>

<header class="masthead">

      <img class="home__mark-real" src="assets/img/zinstim-mark.png"
           width="128" height="114" alt="" aria-hidden="true">
    </span>
  </a>
  <nav class="navgroup" aria-label="Primary" data-group>
    <a class="origin t-ui" href="origin.html">Origin</a>
    <div class="capsule" data-capsule>
      <a class="capsule__label t-ui is-here" data-label href="elements.html">Elements</a>
      <span class="morph" aria-hidden="true"></span>
      <ul class="items">
        <li class="item"><a class="rise t-ui" href="wear.html">Wear</a></li>
        <li class="item"><a class="rise t-ui" href="fuel.html">Fuel</a></li>
        <li class="item"><a class="rise t-ui" href="instruments.html">Instruments</a></li>
      </ul>
    </div>

</header>

    <span class="plate plate--c" aria-hidden="true"></span>

  <div class="cleave cleave--dark" data-reveal aria-hidden="true">

    </svg>
  </div>

  <!-- MARQUEE -->
  <section class="marquee" data-marquee aria-hidden="true">
    <div class="marquee__track">
      <span>Wear</span><span>Fuel</span><span>Instruments</span>
      <span>Wear</span><span>Fuel</span><span>Instruments</span>
