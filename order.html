<main>

  <!-- THE RECEIPT. It holds to one screen: a receipt you have to
       scroll is a receipt you cannot read. Two columns on a desktop —
       the thanks and the actions on the left, the ledger on the right
       — collapsing to one on a phone, where scrolling is the normal
       way to read anything. -->
  <section class="band receipt-band">
    <div class="shell">
      <div class="receipt" data-receipt>

        <div class="receipt__say">
          <h1 class="receipt__thanks" data-r-thanks>Checking your payment&hellip;</h1>
          <p class="receipt__lede" data-r-lede>One moment.</p>
          <p class="receipt__act" data-r-act></p>
          <p class="receipt__note t-meta" data-r-note></p>
          <p class="t-meta" style="color:var(--ink-2)" data-r-ref></p>
        </div>

        <div class="receipt__ledger" data-r-body>
          <ul class="receipt__list" data-r-lines role="list"></ul>
          <div class="receipt__total" data-r-totalrow>
            <span class="receipt__k">Total paid</span>
            <span class="receipt__sum" data-r-total>&mdash;</span>
          </div>
          <dl class="receipt__meta" data-r-meta></dl>
        </div>

      </div>
    </div>
  </section>

</main>


<!-- One dialog, shared by every [data-lock] seal on the page. -->
<dialog class="soon" id="soon" aria-labelledby="soon-title">
  <div class="soon__card">
    <p class="soon__eyebrow"><span class="lock__dot" aria-hidden="true"></span>Not out yet</p>
    <h2 class="soon__title" id="soon-title" data-soon-title></h2>
    <p class="soon__body" data-soon-body></p>
    <p class="soon__note" data-soon-note hidden></p>
    <div class="soon__actions">
      <button class="soon__close" type="button" data-soon-close>Close</button>
      <a class="soon__join" href="#waitlist">Tell me when it lands</a>
    </div>
  </div>
</dialog>


<!-- THE BAG — a drawer, not a page: adding something must not cost
     you the grid you were reading. -->
<dialog class="drawer" id="bag" aria-label="Your bag">
  <div class="drawer__in">
    <div class="drawer__head">
      <p class="t-ui" style="margin:0">Your bag</p>
      <button class="drawer__close" type="button" data-bag-close aria-label="Close bag">Close</button>
    </div>
    <ul class="drawer__list" data-bag-list></ul>
    <div class="drawer__foot">
      <p class="drawer__sum"><span>Subtotal</span><span class="price" data-bag-sum>&mdash;</span></p>
      <button class="btn" type="button" data-bag-checkout>Checkout</button>
      <!-- SSLCommerz needs a name, a way to reach you and somewhere to
           send it. The form stays shut until you ask to pay, so the
           bag is still a bag. -->
      <!-- novalidate: the browser blocks submit on an invalid form, so
     the submit handler never ran and the shopper got a native
     bubble instead of the sentence written for that field. The
     constraints stay on the inputs — :invalid and :user-invalid
     still work — the script just does the telling. -->
      <form class="checkout" data-checkout hidden novalidate>
        <label><span>Name</span><input name="name" autocomplete="name" required minlength="2"
          data-say="Please give your full name."></label>
        <label><span>Email</span><input name="email" type="email" autocomplete="email" required
          data-say="That email address does not look right."></label>
        <!-- at least seven digits, so a phone that cannot be rung does
             not become a delivery nobody can arrange. Punctuation and a
             country code are allowed; "1" is not. -->
        <label><span>Phone</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required
          data-say="A phone number we can reach you on — at least seven digits."></label>
        <label class="checkout--wide"><span>Address</span><input name="address" autocomplete="street-address" required minlength="6"
          data-say="A full street address, so this can actually be delivered."></label>
        <label><span>City</span><input name="city" autocomplete="address-level2" required minlength="2"
          data-say="Which city?"></label>
        <label><span>Postcode</span><input name="postcode" inputmode="numeric" autocomplete="postal-code"></label>
        <button class="btn checkout--wide" type="submit" data-checkout-go>Pay</button>
        <p class="t-meta checkout--wide" data-checkout-state role="status" aria-live="polite"></p>
      </form>
      <p class="drawer__note" data-bag-note>Your bag is kept on this device.</p>
    </div>
  </div>
</dialog>
